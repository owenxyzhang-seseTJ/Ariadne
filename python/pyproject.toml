[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne"
version = "0.5.0"
description = "Experimental agent-native single-crystal reduction extensions for DIALS 3.30.1"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = ["numpy", "scipy", "mcp>=1.12,<2"]

[project.entry-points."dials.spotfinder.threshold"]
ariadne = "dials.extensions.ariadne_spotfinder_threshold_ext:AriadneThresholdExt"

[project.scripts]
ariadne-mcp = "ariadne.server:main"

[tool.setuptools.packages.find]
where = ["src"]
