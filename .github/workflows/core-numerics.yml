name: core numerics and agent

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development dependencies
        run: python -m pip install -e './python[dev]'
      - name: Check Python source and shell syntax
        run: |
          ruff check --select F,E9 python/src skills/ariadne-reduction/scripts tests tests_rebuild scripts benchmarks
          sh -n scripts/install_local.sh
      - name: Run numerical, MCP and agent regressions
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          ARIADNE_PLUGIN_ROOT: ${{ github.workspace }}
          PYTHONPATH: python/src:skills/ariadne-reduction/scripts:tests:examples/agent
        run: |
          python -m pytest tests tests_rebuild -q --junitxml=test-results.xml
      - name: Build Python distribution
        run: python -m build python --outdir /tmp/ariadne-dist
      - name: Verify release manifest
        run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
