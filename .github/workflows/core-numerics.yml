name: core numerics

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run dependency-free numerical tests
        env:
          PYTHONPATH: python/src:skills/ariadne-reduction/scripts:tests
        run: |
          python -m unittest \
            test_constrained_pixels \
            test_profile_positions \
            test_composite_scaling \
            test_numeric_optimization \
            test_conditional_gaussian
